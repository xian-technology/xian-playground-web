[project]
name = "xian-playground"
version = "0.1.0"
description = ""
authors = [{ name = "Endogen", email = "Endogen@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "reflex>=0.9.0,<0.10.0",
    "xian-tech-contracting>=1.0.1,<2.0.0",
    "xian-tech-linter>=0.3.1,<1.0.0",
    "xian-tech-py>=0.4.8,<0.5.0",
    "xian-tech-runtime-types>=0.1.1,<0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
xian-tech-contracting = { path = "../xian-contracting", editable = true }
xian-tech-linter = { path = "../xian-linter", editable = true }
xian-tech-py = { path = "../xian-py", editable = true }
xian-tech-runtime-types = { path = "../xian-contracting/packages/xian-runtime-types", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
