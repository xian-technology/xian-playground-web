name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-playground-web
        uses: actions/checkout@v6
        with:
          path: xian-playground-web

      - name: Checkout xian-contracting
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Checkout xian-linter
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-linter
          ref: main
          path: xian-linter

      - name: Checkout xian-py
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-py
          ref: main
          path: xian-py

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        working-directory: xian-playground-web
        run: poetry install --with dev

      - name: Run tests
        working-directory: xian-playground-web
        run: poetry run pytest -q

      - name: Export Reflex app
        working-directory: xian-playground-web
        run: poetry run reflex export --frontend-only
